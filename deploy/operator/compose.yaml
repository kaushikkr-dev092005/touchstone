services:
  operator:
    build:
      context: ../..
      dockerfile: deploy/operator/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:?Set the reviewed source commit}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes: [operator_data:/var/lib/touchstone]
    networks: [private, quote_egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8089/healthz', headers={'Host':'${OPERATOR_DOMAIN:?Set your operator domain}'}),timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    # No published Python port, payer volume, bank key or hosted-model key.
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      OPERATOR_DOMAIN: ${OPERATOR_DOMAIN:?Set your operator domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private, public]
    depends_on:
      operator:
        condition: service_healthy
volumes:
  operator_data:
  caddy_data:
  caddy_config:
networks:
  private:
    internal: true
  public:
  quote_egress:
