name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the secret scan
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests (no runtime dependencies)
        run: python -m unittest discover -s tests -v
      - name: Install pinned Node dependencies
        working-directory: integrations/metal
        run: npm ci --ignore-scripts --no-fund
      - name: Node tests
        run: python tools/metal.py test
      - name: Secret scan (redacted output)
        run: python tools/scan_secrets.py
